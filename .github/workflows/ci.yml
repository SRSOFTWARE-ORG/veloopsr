name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "security/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint changed AI assistant UI and contracts
        run: bunx eslint src/components/configuracoes/AISearchBar.tsx src/pages/ContratosPage.tsx
      - name: Contract security and integrity audit
        run: node scripts/audit-contracts.mjs
      - name: Unit tests
        run: bun run test
      - name: Production build
        run: bun run build
        env:
          VITE_SUPABASE_PROJECT_ID: ci-placeholder
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
